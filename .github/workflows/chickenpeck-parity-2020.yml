name: ChickenPeck parity 2020 research

on:
  push:
    branches:
      - research/chickenpeck-parity-2020-20260901
    paths:
      - 'research/chickenpeck_parity_2020/**'
      - '.github/workflows/chickenpeck-parity-2020.yml'

concurrency:
  group: chickenpeck-parity-2020-final
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Runtime versions
        run: |
          python --version
          node --version
      - name: Install numerical dependencies
        run: python -m pip install --quiet --disable-pip-version-check numpy pandas numba
      - name: Inspect M1
        run: python research/chickenpeck_parity_2020/inspect_m1.py
      - name: Apply authoritative PMTXD mother contract
        run: python research/chickenpeck_parity_2020/apply_mother_contract_patch.py
      - name: Run causal parity research
        run: python research/chickenpeck_parity_2020/run_research.py
      - name: Fetch and patch single-trades.js
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/Hsu7183/starlift-single-rr/main/single-trades.js \
            --output research/chickenpeck_parity_2020/single-trades.original.js
          python research/chickenpeck_parity_2020/patch_single_trades.py
      - name: Calculate KPI with exact single-trades.js functions
        run: |
          python research/chickenpeck_parity_2020/patch_kpi_harness.py
          node research/chickenpeck_parity_2020/kpi_from_single_trades.js
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: chickenpeck-parity-2020-results
          path: |
            research/chickenpeck_parity_2020/output/**
            research/chickenpeck_parity_2020/inspection.txt
            research/chickenpeck_parity_2020/run_research.py
            research/chickenpeck_parity_2020/single-trades.original.js
            research/chickenpeck_parity_2020/single-trades.patched.js
          if-no-files-found: error
